
name: Hourly Cron Job

on:
  schedule:
    # Thailand time: 03:00, 07:00, 10:00, 15:00, 19:00, 22:00
    - cron: '0 20,0,3,8,12,15 * * *'

  workflow_dispatch:

jobs:
  cron:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Call Cron API
        run: |
          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --max-time 330 \
            -X GET "https://attendance1-k1ds.vercel.app/api/cron/cleanup" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
